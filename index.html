<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3학년 4반 공지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --panel: #151b23;
    --panel-2: #1c2330;
    --text: #e6edf3;
    --muted: #7d8590;
    --border: #262c36;
    --amber: #ffa657;
    --mint: #7ee787;
    --blue: #79c0ff;
    --pink: #ff7b9c;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f6f8fa; --panel: #ffffff; --panel-2: #eef1f5;
      --text: #1b1f24; --muted: #59636e; --border: #d0d7de;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d1117; --panel: #151b23; --panel-2: #1c2330;
    --text: #e6edf3; --muted: #7d8590; --border: #262c36;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans KR', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100%;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 28px 18px 60px;
  }
  .editor {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 20px 60px -20px rgba(0,0,0,0.6);
  }
  .tabbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    background: var(--panel-2);
    border-bottom: 1px solid var(--border);
  }
  .dots { display: flex; gap: 6px; margin-right: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot.r { background: #ff5f56; }
  .dot.y { background: #ffbd2e; }
  .dot.g { background: #27c93f; }
  .filename {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--muted);
  }
  .filename .ext { color: var(--amber); }
  .cursor {
    display: inline-block;
    width: 7px; height: 15px;
    background: var(--mint);
    margin-left: 6px;
    vertical-align: text-bottom;
    animation: blink 1.1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .head {
    padding: 26px 20px 6px;
  }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--mint);
  }
  .eyebrow::before { content: "// "; color: var(--muted); }
  h1 {
    margin: 6px 0 4px;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .sub {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 8px;
  }

  .feed { padding: 8px 12px 20px; }
  .item {
    display: grid;
    grid-template-columns: 44px 1fr;
    gap: 0;
    border-radius: 6px;
    transition: background 0.15s ease;
  }
  .item:hover { background: var(--panel-2); }
  .ln {
    font-family: 'JetBrains Mono', monospace;
    color: var(--muted);
    font-size: 12px;
    text-align: right;
    padding: 12px 10px 12px 0;
    user-select: none;
    border-right: 1px solid var(--border);
  }
  .content { padding: 12px 14px; }
  .tag {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 4px;
    margin-bottom: 6px;
  }
  .tag.due { background: rgba(255,123,156,0.15); color: var(--pink); }
  .tag.info { background: rgba(121,192,255,0.15); color: var(--blue); }
  .tag.ok { background: rgba(126,231,135,0.15); color: var(--mint); }
  .msg { font-size: 15px; line-height: 1.55; }
  .msg b { color: var(--amber); font-weight: 600; }
  .meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-top: 6px;
  }

  .footer {
    text-align: center;
    padding: 22px 0 0;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
  }
  .footer .live {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .footer .live::before {
    content: "";
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--mint);
    box-shadow: 0 0 0 0 rgba(126,231,135,0.6);
    animation: pulse 2s ease-out infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(126,231,135,0.5); }
    70% { box-shadow: 0 0 0 6px rgba(126,231,135,0); }
    100% { box-shadow: 0 0 0 0 rgba(126,231,135,0); }
  }

  @media (max-width: 420px) {
    h1 { font-size: 22px; }
    .ln { padding-right: 6px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="editor">
      <div class="tabbar">
        <div class="dots">
          <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
        </div>
        <span class="filename">공지<span class="ext">.html</span></span>
      </div>

      <div class="head">
        <div class="eyebrow">3학년 4반</div>
        <h1>이번 주 공지<span class="cursor"></span></h1>
        <div class="sub">눌러서 접었다 펴는 기능은 없습니다 — 그냥 쭉 읽으시면 돼요</div>
      </div>

      <div class="feed">
        <div class="item">
          <div class="ln">01</div>
          <div class="content">
            <span class="tag due">마감임박</span>
            <div class="msg">수행평가 <b>수학 1~3단원</b> 범위 확인하세요.</div>
            <div class="meta">수요일까지</div>
          </div>
        </div>
        <div class="item">
          <div class="ln">02</div>
          <div class="content">
            <span class="tag info">준비물</span>
            <div class="msg">체육복 <b>수요일</b>에 꼭 챙겨오기.</div>
            <div class="meta">체육 2교시</div>
          </div>
        </div>
        <div class="item">
          <div class="ln">03</div>
          <div class="content">
            <span class="tag ok">제출</span>
            <div class="msg">현장체험학습 신청서 <b>금요일까지</b> 담임 선생님께 제출.</div>
            <div class="meta">늦으면 불참 처리</div>
          </div>
        </div>
      </div>
    </div>

    <div class="footer">
      <span class="live">이 페이지는 계속 업데이트됩니다</span>
    </div>
  </div>
</body>
</html>
